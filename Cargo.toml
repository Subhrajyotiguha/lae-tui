[package]
name = "lae-tui"
version = "1.0.0"
edition = "2024"

[dependencies]
crossterm = "0.27"
base64 = "0.21"
rand = "0.8.5"
serde_json = "1.0"
urlencoding = "2.1"
ureq = { version = "2.9", features = ["json"] }

[build-dependencies]
cc = "1.2.58"

[package.metadata.deb]
maintainer = "Subhrajyoti Guha <fizzy62091218@proton.me>"
copyright = "2026, Subhrajyoti Guha"
license-file = ["LICENSE", "4"]
extended-description = "A highly optimized, bit-perfect Linux audio player built with C and a Rust TUI."
depends = "$auto"
section = "sound"
priority = "optional"
assets = [
    ["target/release/lae-tui", "usr/bin/lae-tui", "755"]
]
